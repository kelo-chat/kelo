<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <style>
    .pose-front { opacity: 0; animation: toggle-front 4.5s infinite; transform-origin: 50px 65px; }
    .pose-back { opacity: 1; animation: toggle-back 4.5s infinite; transform-origin: 50px 65px; }
    .typing-wing { animation: type-keys 0.22s ease-in-out infinite alternate; transform-origin: 62px 70px; }
    .screen-glow { animation: monitor-pulse 0.8s ease-in-out infinite alternate; }
    .click-spark { animation: spark-pop 0.6s ease-out infinite; transform-origin: 96px 40px; }
    @keyframes toggle-front { 0%, 20% { opacity: 1; transform: scaleX(1); } 24%, 92% { opacity: 0; transform: scaleX(0.15); } 96%, 100% { opacity: 1; transform: scaleX(1); } }
    @keyframes toggle-back { 0%, 21% { opacity: 0; transform: scaleX(0.15); } 25%, 91% { opacity: 1; transform: scaleX(1); } 95%, 100% { opacity: 0; transform: scaleX(0.15); } }
    @keyframes type-keys { 0% { transform: rotate(-6deg) translateY(0px); } 100% { transform: rotate(8deg) translateY(3px); } }
    @keyframes monitor-pulse { 0% { fill: #E1F5FE; } 100% { fill: #B3E5FC; } }
    @keyframes spark-pop { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
  </style>
