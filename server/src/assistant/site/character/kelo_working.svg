<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <style>
    .pose-front { opacity: 0; animation: toggle-front 4.5s infinite; transform-origin: 50px 65px; }
    .pose-back { opacity: 1; animation: toggle-back 4.5s infinite; transform-origin: 50px 65px; }
    .writing-wing { animation: write-move 0.3s ease-in-out infinite alternate; transform-origin: 68px 68px; }
    .scribble-lines { animation: scribble-float 0.6s ease-in-out infinite; }
    .body-bob { animation: work-bob 0.3s ease-in-out infinite alternate; transform-origin: 48px 90px; }
    @keyframes toggle-front { 0%, 20% { opacity: 1; transform: scaleX(1); } 24%, 92% { opacity: 0; transform: scaleX(0.15); } 96%, 100% { opacity: 1; transform: scaleX(1); } }
    @keyframes toggle-back { 0%, 21% { opacity: 0; transform: scaleX(0.15); } 25%, 91% { opacity: 1; transform: scaleX(1); } 95%, 100% { opacity: 0; transform: scaleX(0.15); } }
    @keyframes write-move { 0% { transform: rotate(-8deg) translate(0px, 0px); } 100% { transform: rotate(10deg) translate(3px, -2px); } }
    @keyframes work-bob { 0% { transform: translateY(0px); } 100% { transform: translateY(1.5px); } }
    @keyframes scribble-float { 0%, 100% { opacity: 0.35; transform: translateY(1px); } 50% { opacity: 1; transform: translateY(-2px); } }
  </style>
