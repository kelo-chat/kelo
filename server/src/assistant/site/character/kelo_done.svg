  <style>
    .kelo-jump { animation: jump 0.8s ease-in-out infinite; transform-origin: 60px 95px; }
    .sparkle { animation: pop-star 0.8s ease-in-out infinite; transform-origin: center; }
    @keyframes jump { 0%, 100% { transform: translateY(0) scale(1.03, 0.97); } 45% { transform: translateY(-9px) scale(0.98, 1.03); } }
    @keyframes pop-star { 0%, 100% { transform: scale(0.6); opacity: 0.4; } 45% { transform: scale(1.15); opacity: 1; } }
  </style>
