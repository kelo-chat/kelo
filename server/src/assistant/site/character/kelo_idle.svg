<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <style>
    .kelo-breathe { animation: breathe 2.4s ease-in-out infinite; transform-origin: 60px 95px; }
    .kelo-eyes { animation: blink 3.6s infinite; transform-origin: 60px 58px; }
    .kelo-leaf { animation: leaf-sway 2.4s ease-in-out infinite; transform-origin: 60px 28px; }
    @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-2px) scale(1.02, 0.98); } }
    @keyframes blink { 0%, 44%, 48%, 92%, 96%, 100% { transform: scaleY(1); } 46%, 94% { transform: scaleY(0.1); } }
    @keyframes leaf-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
  </style>
  <g class="kelo-breathe">
    <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF">
      <path d="M60 28 C50 14, 58 8, 64 16 C68 21, 63 26, 60 28 Z" />
      <path d="M30 66 C20 72, 20 82, 28 80" />
      <path d="M90 66 C100 72, 100 82, 92 80" />
      <path d="M60 28 C36 28, 26 48, 28 72 C29 88, 42 96, 60 96 C78 96, 91 88, 92 72 C94 48, 84 28, 60 28 Z" />
      <path d="M48 96 L48 104 M43 104 L53 104" />
      <path d="M72 96 L72 104 M67 104 L77 104" />
    </g>
    <g stroke="#1A1A1A" stroke-width="4" stroke-linecap="round">
      <path d="M48 94 L48 104 M43 104 L53 104" />
      <path d="M72 94 L72 104 M67 104 L77 104" />
    </g>
    <g class="kelo-leaf">
      <path d="M60 29 C48 15, 57 7, 65 15 C69 20, 64 27, 60 29 Z" fill="#66BB6A" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round" />
    </g>
    <path d="M60 28 C36 28, 26 48, 28 72 C29 88, 42 96, 60 96 C78 96, 91 88, 92 72 C94 48, 84 28, 60 28 Z" fill="#29B6F6" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round" />
    <path d="M60 64 C44 64, 38 78, 41 92 C46 95, 53 96, 60 96 C67 96, 74 95, 79 92 C82 78, 76 64, 60 64 Z" fill="#B3E5FC" />
    <path d="M60 28 C36 28, 26 48, 28 72 C29 88, 42 96, 60 96 C78 96, 91 88, 92 72 C94 48, 84 28, 60 28 Z" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round" />
    <path d="M29 60 C19 68, 19 82, 29 79" fill="#039BE5" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M91 60 C101 68, 101 82, 91 79" fill="#039BE5" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
