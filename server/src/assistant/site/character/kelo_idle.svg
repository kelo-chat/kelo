    <ellipse cx="80" cy="63" rx="4.5" ry="2.5" fill="#81D4FA" />
    <g class="kelo-eyes">
      <circle cx="46" cy="57" r="4.2" fill="#1A1A1A" />
      <circle cx="74" cy="57" r="4.2" fill="#1A1A1A" />
      <circle cx="44.8" cy="55.5" r="1.3" fill="#FFFFFF" />
      <circle cx="72.8" cy="55.5" r="1.3" fill="#FFFFFF" />
    </g>
    <ellipse cx="60" cy="60" rx="6" ry="3.5" fill="#FFB300" stroke="#1A1A1A" stroke-width="3.5" />
