name: Feature request
description: Suggest something Kelo should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Kelo is a solo project worked on alongside a full-time job, so a reply may take a while.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, in your own words. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches welcome.
  - type: dropdown
    id: part
    attributes:
      label: Which part of Kelo?
      multiple: true
      options:
        - Chat and agent
        - Goals
        - Work (tasks, schedules, browser)
        - Connectors
        - Models and providers
        - Apps (Android / iOS / desktop)
        - Installing and connecting
        - Other
