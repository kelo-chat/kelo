# Kelo tests on every push and pull request: the server (pytest), the Android unit tests with the string check, and the desktop
# tests on Linux. A failed run mails the person who pushed (GitHub's default "Actions" notification; the owner gets it for the
# pushes they make, and for pull requests through the checks on the PR).
#
# Not here, on purpose:
#   - iOS: macOS runners cost about ten times a Linux one, so the iOS build and tests run on the Mac (tools/build/ios.sh sim) and
#     on GitHub only before a release.
#   - Windows desktop: desktop-windows.yml (tests plus the installers).
#   - Release images: release-images.yml (on version tags).

name: ci

on:
  # main only, and not for changes that no job here tests (owner, 2026-11-11: the private repo's Actions minutes)
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/security/e2e-vectors.*"   # the shared vectors and their pin are tested here, so their changes run CI
      - "apps/ios/**"
      - "site/**"
      - "apps/desktop/screens/**"
      - "apps/desktop/store/**"
      - "apps/desktop/packaging/**"
      - ".github/workflows/desktop-windows.yml"
      - ".github/workflows/release-*.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/security/e2e-vectors.*"   # the shared vectors and their pin are tested here, so their changes run CI
      - "apps/ios/**"
      - "site/**"
      - "apps/desktop/screens/**"
      - "apps/desktop/store/**"
      - "apps/desktop/packaging/**"
      - ".github/workflows/desktop-windows.yml"
      - ".github/workflows/release-*.yml"
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch (or PR) stops the run that is still going for the older one
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true                 # the uv download cache, keyed on uv.lock
          cache-dependency-glob: uv.lock

      - name: Python and the locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked --dev

      # the browser tools are tested against real Chromium pages (server/tests/fixtures); the browser is cached between runs
      - name: Playwright's Chromium (cached)
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      - name: Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium

      # the KE2E vectors: the file equals the generator's output and its SHA-256 matches e2e-vectors.sha256
      - name: E2E vectors match the generator
        run: uv run python server/tests/e2e_vectors_gen.py --check

      - name: Tests
        env:
          TZ: Asia/Seoul
          KELO_REQUIRE_VECTORS: "1"   # the apps' vectors tests fail, not skip, when the file is missing
        run: uv run pytest -q -p no:cacheprovider

  android:
    name: Android unit tests and strings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android/kelo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # the shared Kotlin code hits a Kotlin backend error on 17 (BriefingWeather.copy$default); local builds use 21

      # caches ~/.gradle (wrapper, dependencies, build cache); only the main branch writes it, other branches read it
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: String resources in every language
        working-directory: .
        run: python3 apps/android/tools/strings_check.py

      - name: iPhone version file matches version.json
        working-directory: .
        run: python3 apps/ios/tools/gen_version.py --check

      # also runs apps/shared's Ke2eVectorsFileTest (the shared desktopTest, see apps/android/kelo/app/build.gradle.kts)
      - name: Unit tests (full debug)
        env:
          KELO_REQUIRE_VECTORS: "1"
        run: ./gradlew --no-daemon --console=plain :app:testFullDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-unit-test-report
          path: |
            apps/android/kelo/app/build/reports/tests
            apps/android/kelo/app/build/test-results
            apps/shared/build/reports/tests
            apps/shared/build/test-results
          if-no-files-found: ignore

  desktop:
    name: desktop tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # the shared Kotlin code hits a Kotlin backend error on 17 (BriefingWeather.copy$default); local builds use 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the tests draw with Skia off screen (java.awt.headless); fonts so Korean and other scripts measure like on a desktop
      - name: Fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-core

      # `test` also runs apps/shared's desktopTest (Ke2eVectorsFileTest): tasks.test dependsOn it in build.gradle.kts
      - name: Tests
        env:
          KELO_REQUIRE_VECTORS: "1"
        run: ./gradlew --no-daemon --console=plain test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-linux-test-report
          path: |
            apps/desktop/build/reports/tests/test
            apps/desktop/build/test-results/test
            apps/shared/build/reports/tests
            apps/shared/build/test-results
            apps/desktop/build/parity
            apps/desktop/build/mock-server
          if-no-files-found: ignore
