org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Reproducible Play bundles: R8 rewrites the baseline profile (baseline.prof/.profm) on a thread pool and a merged lambda class was
# sometimes in it, sometimes not. One R8 thread makes that order fixed (the dex was identical either way). Release builds get a bit
# slower; debug builds do not run R8. (AGP 8.10 IntegerOption R8_THREAD_POOL_SIZE: used for the in-process and separate-process R8.)
android.r8.threadPoolSize=1
