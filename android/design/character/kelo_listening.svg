    .wave2 { animation: wave-pulse 1.2s infinite 0.35s; }
    @keyframes lean { 0% { transform: rotate(0deg); } 100% { transform: rotate(4deg); } }
    @keyframes wave-pulse { 0%, 100% { opacity: 0.25; transform: translateX(0); } 50% { opacity: 1; transform: translateX(2px); } }
  </style>
