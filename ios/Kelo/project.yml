# XcodeGen spec for the Kelo iPhone app. Generate the Xcode project with ./generate.sh (or `xcodegen generate` here), then open
# Kelo.xcodeproj. The app target is thin: everything is in the local Swift packages ../KeloUI (screens) and ../KeloCore (API,
# rules, character). Before running on a phone, set your signing team (DEVELOPMENT_TEAM below or in Xcode → Signing & Capabilities).
name: Kelo
options:
  bundleIdPrefix: chat.kelo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    # CFBundleShortVersionString: the App Store's marketing number. It stays 1.0.0 (App Store Connect refuses a version below the
    # published 1.0.0); the release people see is version.json's "version" (0.9.0), compiled in by ios/tools/gen_version.py
    # (KeloVersion), shown in My and sent as X-Kelo-App: ios/<version>+<CFBundleVersion> (docs/versioning.md).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "26111011"   # build number (CFBundleVersion): whole number, must grow with every upload (YYMMDDHH)
    DEVELOPMENT_TEAM: P6GD4DM9C5     # Apple team id (App Store Connect team that owns chat.kelo.app)
    CODE_SIGN_STYLE: Automatic
packages:
  KeloUI:
    path: ../KeloUI
  KeloCore:
    path: ../KeloCore
targets:
  Kelo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: KeloUI
        product: KeloUI
      - target: KeloShare
    # aps-environment (remote notifications): "development" here; Xcode's distribution signing (TestFlight, App Store) swaps in
    # "production". The App ID chat.kelo.app needs the Push Notifications capability (Apple Developer → Identifiers).
    entitlements:
      path: App/Kelo.entitlements
      properties:
        aps-environment: development
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kelo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko, ja, zh-Hans, zh-Hant, es, fr, de, pt-BR, it, ru, id, vi, th, tr, ar, hi, pl, nl, uk]
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [chat.kelo.app.refresh]
        # default texts; each language's own are in App/Resources/<lang>.lproj/InfoPlist.strings (ios/tools/gen_strings.py)
        NSCameraUsageDescription: Kelo uses the camera to scan a pairing QR code or a payment card, and to take photos you choose to send in the chat. Scans are read on this iPhone and not saved.
        NSMicrophoneUsageDescription: Kelo uses the microphone only while voice input is on, to turn what you say into text.
        NSSpeechRecognitionUsageDescription: Your iPhone's speech recognition turns what you say into text for the chat.
        NSFaceIDUsageDescription: Face ID unlocks your Keychain and payment cards in Kelo.
        NSCalendarsFullAccessUsageDescription: Reads your events to answer. If you allow it, adds events too, after you approve.
        NSCalendarsUsageDescription: Reads your events to answer. If you allow it, adds events too, after you approve.
        NSContactsUsageDescription: Finds numbers and emails by name. Read only.
        NSLocationWhenInUseUsageDescription: "Kelo uses your location for the briefing's weather and for questions about places near you. It is sent only when you open the app, and only to your own Kelo server."
        NSPhotoLibraryAddUsageDescription: Kelo saves pictures and files you choose to keep to your photo library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kelo.app
        PRODUCT_NAME: Kelo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  # "Send to Kelo" in the share sheet: leaves the shared text / one file in the App Group for the app (ShareInbox).
  KeloShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Share
        excludes:
          - Info.plist
    entitlements:
      path: Share/KeloShare.entitlements
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Send to Kelo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kelo.app.share
        PRODUCT_NAME: KeloShare
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
  # Walks the app against a pretend server (desktop/tools/mock_server.py on another port) and saves screenshots; see
  # UITests/KeloScreensTests.swift. Simulator only, never signed.
  KeloUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Kelo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kelo.app.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kelo:
    build:
      targets:
        Kelo: all
        KeloUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeloUITests
    archive:
      config: Release
