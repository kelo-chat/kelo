<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <style>
    .kelo-shiver { animation: shiver 0.4s ease-in-out infinite alternate; transform-origin: 60px 95px; }
