[project]
name = "assistant"
version = "0.10.7"
description = "Kelo: a self-hosted personal AI agent"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "av>=14",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "holidays>=0.60",
    "httpx[http2,socks]>=0.28.1",
    "icalendar>=7.3.0",
    "mutagen>=1.48.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pillow-heif>=1.1",
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "psutil>=6.1",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "recurring-ical-events>=3.8.2",
    "rich>=13",
    "segno>=1.6.6",
    "uvicorn>=0.54.0",
    "websockets>=15",
    "opencc-python-reimplemented",
    "sherpa-onnx==2.0.1",
    "numpy>=2",
    "num2words==0.5.14",
    "babel>=2.16",
]

[project.scripts]
assistant = "assistant.cli:main"
kelo = "assistant.nest_cli:main"

[project.optional-dependencies]
aws = ["boto3>=1.35"]
gcp = ["google-auth>=2.35", "requests>=2.32"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "server/src"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["server/tests"]
markers = ["keyguard_real: the test sees Keyguard's real state (auto-pay rules; see server/tests/conftest.py)"]
